name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: EjectData
          path: build/EjectData.app
